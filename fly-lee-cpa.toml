app = "lee-cpa"
primary_region = "sin"

[build]
  image = "eceasy/cli-proxy-api:v7.2.159"

[env]
  DEPLOY = "cloud"
  WRITABLE_PATH = "/data/cpa"

[mounts]
  source = "lee_cpa_data"
  destination = "/data/cpa"

[http_service]
  internal_port = 8317
  force_https = true
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"