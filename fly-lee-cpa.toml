app = "lee-cpa"
primary_region = "nrt"

[build]
  image = "eceasy/cli-proxy-api:latest"

[env]
  DEPLOY = "cloud"
  WRITABLE_PATH = "/data/cpa"

[processes]
  app = '''sh -c 'set -e; test -f /data/cpa/config.yaml || (mkdir -p /data/cpa/auths && sed -e "s|~/.cli-proxy-api|/data/cpa/auths|" -e "s|allow-remote: false|allow-remote: true|" -e "s|secret-key: \"\"|secret-key: \"change-me-later\"|" /CLIProxyAPI/config.example.yaml > /data/cpa/config.yaml); cd /data/cpa; exec /CLIProxyAPI/CLIProxyAPI -config /data/cpa/config.yaml' '''

[mounts]
  source = "lee_cpa_data"
  destination = "/data/cpa"

[http_service]
  processes = ["app"]
  internal_port = 8317
  force_https = true
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"