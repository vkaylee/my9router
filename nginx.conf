worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  log_format container_access '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /dev/stdout container_access;

  client_body_temp_path /tmp/nginx/client_temp;
  proxy_temp_path /tmp/nginx/proxy_temp;
  fastcgi_temp_path /tmp/nginx/fastcgi_temp;
  uwsgi_temp_path /tmp/nginx/uwsgi_temp;
  scgi_temp_path /tmp/nginx/scgi_temp;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' "";
  }

  upstream dashboard {
    server 127.0.0.1:3000;
    keepalive 16;
  }

  upstream go_proxy {
    server 127.0.0.1:20129;
    keepalive 16;
  }

  server {
    listen 20128;
    server_name _;

    # Expose the Go proxy below /9router-go; proxy_pass strips the prefix.
    location = /9router-go {
      return 308 /9router-go/;
    }

    location ^~ /9router-go/ {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      proxy_connect_timeout 10s;
      proxy_set_header X-Accel-Buffering no;
      proxy_pass http://go_proxy/;
    }

    # Fly health checks the public Go proxy health endpoint.
    location = /health {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_pass http://go_proxy/health;
    }

    # The dashboard's documented LLM surface is /v1/*; Next rewrites it to
    # /api/v1/* internally. Keep this namespace unbuffered for SSE streaming.
    location ^~ /v1/ {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      proxy_connect_timeout 10s;
      proxy_set_header X-Accel-Buffering no;
      proxy_pass http://dashboard;
    }

    # /responses and /codex/* are explicit Next.js rewrites to the Responses
    # API. They are LLM routes, not frontend management APIs.
    location = /responses {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      proxy_connect_timeout 10s;
      proxy_set_header X-Accel-Buffering no;
      proxy_pass http://dashboard;
    }

    location ^~ /codex/ {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      proxy_connect_timeout 10s;
      proxy_set_header X-Accel-Buffering no;
      proxy_pass http://dashboard;
    }

    # Root is the dashboard entry page. It redirects GET / to /dashboard; it
    # is not an Anthropic API endpoint in the upstream source.
    location = / {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      proxy_pass http://dashboard;
    }

    # /api/v1/* is the dashboard's concrete Next.js LLM API namespace.
    location = /api/v1 {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      proxy_connect_timeout 10s;
      proxy_set_header X-Accel-Buffering no;
      proxy_pass http://dashboard;
    }

    location ^~ /api/v1/ {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      proxy_connect_timeout 10s;
      proxy_set_header X-Accel-Buffering no;
      proxy_pass http://dashboard;
    }

    # All other /api/* routes are dashboard/frontend management APIs.
    location ^~ /api/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      proxy_pass http://dashboard;
    }


    # Dashboard UI, auth, static assets, and websocket endpoints.
    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      proxy_pass http://dashboard;
    }
  }
}
