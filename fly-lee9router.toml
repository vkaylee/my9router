app = "lee9router"
primary_region = "sin"


[env]
  DATA_DIR = "/app/data"
  PORT = "3000"
  HOSTNAME = "0.0.0.0"
  NODE_ENV = "production"
  AUTH_COOKIE_SECURE = "true"
  REQUIRE_API_KEY = "true"
  GO_PORT = "20129"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    DASHBOARD_VERSION = "v0.5.81"
    GO_VERSION = "v1.8.18"


[mounts]
  source = "9router_data"
  destination = "/app/data"

[http_service]
  internal_port = 20128
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
