name: Release 9router to Fly.io

on:
  schedule:
    - cron: "17 * * * *"
  workflow_run:
    workflows:
      - Bootstrap lee9router on Fly.io
    types:
      - completed
  workflow_dispatch:
    inputs:
      dashboard_version:
        description: "9router dashboard release tag; empty uses newest tag"
        required: false
        default: ""
        type: string
      go_version:
        description: "9router-go release tag; empty uses newest tag"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: fly-release-lee9router
  cancel-in-progress: false

env:
  FLY_APP: lee9router

jobs:
  release:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve release versions
        id: versions
        env:
          DASHBOARD_VERSION_INPUT: ${{ inputs.dashboard_version }}
          GO_VERSION_INPUT: ${{ inputs.go_version }}
        run: |
          set -euo pipefail

          latest_tag() {
            git ls-remote --tags --refs "$1" 'refs/tags/v*' \
              | sed 's#.*refs/tags/##' \
              | sort -V \
              | awk 'END { print }'
          }

          dashboard_version="${DASHBOARD_VERSION_INPUT:-$(latest_tag https://github.com/decolua/9router.git)}"
          go_version="${GO_VERSION_INPUT:-$(latest_tag https://github.com/luqman-v1/9router-go.git)}"
          test -n "$dashboard_version"
          test -n "$go_version"
          git ls-remote --exit-code --refs \
            https://github.com/decolua/9router.git "refs/tags/$dashboard_version" >/dev/null
          git ls-remote --exit-code --refs \
            https://github.com/luqman-v1/9router-go.git "refs/tags/$go_version" >/dev/null
          printf 'dashboard_version=%s\n' "$dashboard_version" >> "$GITHUB_OUTPUT"
          printf 'go_version=%s\n' "$go_version" >> "$GITHUB_OUTPUT"
          printf 'Dashboard source tag: `%s`\nGo binary release: `%s`\n' \
            "$dashboard_version" "$go_version" >> "$GITHUB_STEP_SUMMARY"

      - name: Derive immutable image reference
        id: image
        env:
          DASHBOARD_TAG: ${{ steps.versions.outputs.dashboard_version }}
          GO_TAG: ${{ steps.versions.outputs.go_version }}
        run: |
          set -euo pipefail
          # Deployment config (nginx.conf, Dockerfile, entrypoint, Fly config)
          # changes the built image, so it must change the tag too. Otherwise
          # the already-deployed check below skips config-only changes.
          # Hash every tracked file except CI workflow definitions, so new
          # config files are picked up without maintaining a list here.
          config_hash="$(
            git ls-files -z ':!.github' \
              | sort -z \
              | xargs -0 sha256sum \
              | sha256sum \
              | cut -c1-12
          )"
          image_tag="dashboard-${DASHBOARD_TAG}-go-${GO_TAG}-cfg-${config_hash}"
          image="registry.fly.io/${FLY_APP}:${image_tag}"
          printf 'tag=%s\n' "$image_tag" >> "$GITHUB_OUTPUT"
          printf 'ref=%s\n' "$image" >> "$GITHUB_OUTPUT"
          printf 'Image: `%s`\n' "$image" >> "$GITHUB_STEP_SUMMARY"

      - name: Skip when release is already deployed
        id: deployed
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_LEE9ROUTER_API_TOKEN || secrets.FLY_API_TOKEN }}
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          : "${FLY_API_TOKEN:?Missing FLY_LEE9ROUTER_API_TOKEN or FLY_API_TOKEN secret}"
          machines="$(flyctl machine list --app "$FLY_APP" --json)"
          if jq -e --arg image "$IMAGE" 'length > 0 and all(.[]; .config.image == $image)' <<<"$machines" >/dev/null; then
            echo "Release image is already deployed: $IMAGE"
            echo "already-deployed=true" >> "$GITHUB_OUTPUT"
          else
            echo "already-deployed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate Docker with Fly registry
        if: steps.deployed.outputs.already-deployed != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_LEE9ROUTER_API_TOKEN || secrets.FLY_API_TOKEN }}
        run: flyctl auth docker

      - name: Build and push combined image
        if: steps.deployed.outputs.already-deployed != 'true'
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          DASHBOARD_TAG: ${{ steps.versions.outputs.dashboard_version }}
          GO_TAG: ${{ steps.versions.outputs.go_version }}
        run: |
          set -euo pipefail
          docker buildx build \
            --file Dockerfile \
            --build-arg "DASHBOARD_VERSION=$DASHBOARD_TAG" \
            --build-arg "GO_VERSION=$GO_TAG" \
            --platform linux/amd64 \
            --tag "$IMAGE" \
            --push \
            .

      - name: Deploy release image to Fly.io
        if: steps.deployed.outputs.already-deployed != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_LEE9ROUTER_API_TOKEN || secrets.FLY_API_TOKEN }}
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          flyctl deploy \
            --app "$FLY_APP" \
            --config ./fly-lee9router.toml \
            --image "$IMAGE"
