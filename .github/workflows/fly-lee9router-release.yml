name: Release 9router to Fly.io

on:
  schedule:
    - cron: "17 * * * *"
  workflow_run:
    workflows:
      - Bootstrap lee9router on Fly.io
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional upstream release tag, for example v0.5.81"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: fly-release-lee9router
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: decolua/9router
  FLY_APP: lee9router

jobs:
  release:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve upstream release tag
        id: release
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          upstream_url="https://github.com/$UPSTREAM_REPOSITORY.git"
          if [ -n "$RELEASE_TAG_INPUT" ]; then
            release_tag="$RELEASE_TAG_INPUT"
            git ls-remote --exit-code --refs "$upstream_url" "refs/tags/$release_tag" >/dev/null
          else
            release_tag="$(git ls-remote --tags --refs "$upstream_url" \
              | awk -F/ '$3 ~ /^v[0-9]+(\.[0-9]+){1,2}([.-][0-9A-Za-z.-]+)?$/ { print $3 }' \
              | sort -V \
              | tail -n 1)"
          fi

          if [ -z "$release_tag" ]; then
            echo "No upstream release tag was found" >&2
            exit 1
          fi
          if [[ ! "$release_tag" =~ ^v[0-9]+(\.[0-9]+){1,2}([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported upstream release tag: $release_tag" >&2
            exit 1
          fi

          release_url="https://github.com/$UPSTREAM_REPOSITORY/releases/tag/$release_tag"
          printf 'tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"
          printf 'url=%s\n' "$release_url" >> "$GITHUB_OUTPUT"
          printf 'Resolved `%s` (%s)\n' "$release_tag" "$release_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Check out upstream release source
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: git clone --depth 1 --branch "$RELEASE_TAG" "https://github.com/$UPSTREAM_REPOSITORY.git" upstream

      - name: Derive immutable image reference
        id: image
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        working-directory: upstream
        run: |
          set -euo pipefail
          release_commit="$(git rev-parse HEAD)"
          image_tag="${RELEASE_TAG}-${release_commit:0:12}"
          image="registry.fly.io/${FLY_APP}:${image_tag}"
          printf 'commit=%s\n' "$release_commit" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$image_tag" >> "$GITHUB_OUTPUT"
          printf 'ref=%s\n' "$image" >> "$GITHUB_OUTPUT"
          printf 'Source commit: `%s`\nImage: `%s`\n' "$release_commit" "$image" >> "$GITHUB_STEP_SUMMARY"

      - name: Skip when release is already deployed
        id: deployed
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_LEE9ROUTER_API_TOKEN || secrets.FLY_API_TOKEN }}
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          : "${FLY_API_TOKEN:?Missing FLY_LEE9ROUTER_API_TOKEN or FLY_API_TOKEN secret}"
          machines="$(flyctl machine list --app "$FLY_APP" --json)"
          if jq -e --arg image "$IMAGE" 'length > 0 and all(.[]; .config.image == $image)' <<<"$machines" >/dev/null; then
            echo "Release image is already deployed: $IMAGE"
            echo "Already deployed: \\`$IMAGE\\`" >> "$GITHUB_STEP_SUMMARY"
            echo "already-deployed=true" >> "$GITHUB_OUTPUT"
          else
            echo "already-deployed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate Docker with Fly registry
        if: steps.deployed.outputs.already-deployed != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_LEE9ROUTER_API_TOKEN || secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl auth docker

      - name: Build and push release image
        if: steps.deployed.outputs.already-deployed != 'true'
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          docker buildx build \
            --file upstream/Dockerfile \
            --platform linux/amd64 \
            --tag "$IMAGE" \
            --push \
            upstream

      - name: Deploy release image to Fly.io
        if: steps.deployed.outputs.already-deployed != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_LEE9ROUTER_API_TOKEN || secrets.FLY_API_TOKEN }}
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          flyctl deploy \
            --app "$FLY_APP" \
            --config ./fly-lee9router.toml \
            --image "$IMAGE"
