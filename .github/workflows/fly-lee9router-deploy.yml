name: Deploy lee9router

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fly-deploy-lee9router
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --config ./fly-lee9router.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_LEE9ROUTER_API_TOKEN || secrets.FLY_API_TOKEN }}
