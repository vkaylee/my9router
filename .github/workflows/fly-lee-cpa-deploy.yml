name: Deploy lee-cpa

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: fly-deploy-lee-cpa
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --config ./fly-lee-cpa.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_LEE_CPA_API_TOKEN || secrets.FLY_API_TOKEN }}