name: Bootstrap 9router on Fly.io

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read app name
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import tomllib

          config = tomllib.load(open("fly.toml", "rb"))
          values = {
              "FLY_APP": config.get("app"),
              "FLY_REGION": config.get("primary_region"),
              "FLY_VOLUME": config.get("mounts", {}).get("source"),
          }
          for name, value in values.items():
              if not isinstance(value, str) or not value:
                  raise SystemExit(f"fly.toml must define {name}")
              print(f"{name}={value}")
          PY

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Create app if missing
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_BOOTSTRAP_TOKEN }}
          FLY_ORG: ${{ vars.FLY_ORG }}
        run: |
          if ! flyctl apps create "$FLY_APP" --org "$FLY_ORG"; then
            flyctl apps show "$FLY_APP" >/dev/null
          fi

          for attempt in {1..12}; do
            if flyctl apps show "$FLY_APP" >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          flyctl apps show "$FLY_APP" >/dev/null

      - name: Create volume if missing
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_BOOTSTRAP_TOKEN }}
        run: |
          for attempt in {1..12}; do
            if flyctl volumes list --app "$FLY_APP" --json \
              | jq -e --arg name "$FLY_VOLUME" --arg region "$FLY_REGION" \
                'any(.[]; .name == $name and .region == $region)' >/dev/null; then
              exit 0
            fi
            sleep 5
          done

          flyctl volumes create "$FLY_VOLUME" \
            --app "$FLY_APP" \
            --region "$FLY_REGION" \
            --size 10 \
            --yes

      - name: Set application secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_BOOTSTRAP_TOKEN }}
          INITIAL_PASSWORD: ${{ secrets.INITIAL_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          API_KEY_SECRET: ${{ secrets.API_KEY_SECRET }}
          MACHINE_ID_SALT: ${{ secrets.MACHINE_ID_SALT }}
        run: |
          : "${INITIAL_PASSWORD:?Missing INITIAL_PASSWORD secret}"
          : "${JWT_SECRET:?Missing JWT_SECRET secret}"
          : "${API_KEY_SECRET:?Missing API_KEY_SECRET secret}"
          : "${MACHINE_ID_SALT:?Missing MACHINE_ID_SALT secret}"
          flyctl secrets set \
            "INITIAL_PASSWORD=$INITIAL_PASSWORD" \
            "JWT_SECRET=$JWT_SECRET" \
            "API_KEY_SECRET=$API_KEY_SECRET" \
            "MACHINE_ID_SALT=$MACHINE_ID_SALT" \
            --app "$FLY_APP"

      - name: Deploy application
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_BOOTSTRAP_TOKEN }}
        run: flyctl deploy --remote-only --config ./fly.toml
